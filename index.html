<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя 🍁</title>
    <style>
        /* --- ОБЩИЕ СТИЛИ И ОСЕННИЙ ФОН --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8c9a0 50%, #d4a373 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #4a3728;
        }

        /* --- ПАДАЮЩИЕ ЛИСТЬЯ --- */
        .leaf {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* --- МУЗЫКА --- */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #b07d4b;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.1);
        }

        /* --- ЗАГОЛОВОК --- */
        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
            z-index: 5;
        }
        header h1 {
            font-size: 3em;
            color: #6b4423;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            margin: 0;
        }
        header p {
            font-size: 1.2em;
            color: #8b5a2b;
            font-style: italic;
        }

        /* --- ФОТОГРАФИИ --- */
        .gallery {
            position: relative;
            width: 100%;
            height: 600px;
            z-index: 5;
        }
        .photo {
            position: absolute;
            background: #fff;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            border-radius: 2px;
        }
        .photo:hover {
            transform: scale(1.1) rotate(0deg) !important;
            z-index: 10;
        }
        .photo img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }
        .photo .caption {
            text-align: center;
            font-family: 'Brush Script MT', cursive;
            color: #6b4423;
            margin-top: 10px;
            font-size: 1.1em;
        }

        /* Позиции для 3 фото (можно менять) */
        .photo-1 {
            top: 20px;
            left: 5%;
            width: 260px;
            transform: rotate(-8deg);
            z-index: 3;
        }
        .photo-2 {
            top: 150px;
            right: 8%;
            width: 280px;
            transform: rotate(6deg);
            z-index: 4;
        }
        .photo-3 {
            top: 320px;
            left: 25%;
            width: 250px;
            transform: rotate(-4deg);
            z-index: 2;
        }

        /* --- МАГАЗИН ПОДАРКОВ --- */
        .shop {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(107, 68, 35, 0.2);
            position: relative;
            z-index: 5;
        }
        .shop h2 {
            text-align: center;
            color: #6b4423;
            font-size: 2em;
            border-bottom: 2px dashed #b07d4b;
            padding-bottom: 10px;
        }
        .balance-box {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #8b4513;
            background: #fdf5e6;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 2px solid #d4a373;
        }
        .balance-box span {
            color: #b22222;
            font-size: 1.3em;
        }

        /* Сетка товаров */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            background: #fff8f0;
            border: 2px solid #e0c3a0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(107, 68, 35, 0.2);
        }
        .item-card h3 {
            margin: 0 0 8px;
            color: #6b4423;
            font-size: 1.1em;
        }
        .item-price {
            font-weight: bold;
            color: #b22222;
            font-size: 1.2em;
            margin: 5px 0;
        }
        .buy-btn {
            background: linear-gradient(135deg, #d4a373, #b07d4b);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: bold;
        }
        .buy-btn:hover {
            background: linear-gradient(135deg, #b07d4b, #8b5a2b);
            transform: scale(1.03);
        }
        .buy-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* --- БЛОК ЗАРАБОТКА БАЛЛОВ --- */
        .earn-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(107, 68, 35, 0.15);
            position: relative;
            z-index: 5;
        }
        .earn-section h2 {
            text-align: center;
            color: #6b4423;
            font-size: 1.8em;
        }
        .earn-list {
            list-style: none;
            padding: 0;
        }
        .earn-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin: 8px 0;
            background: #fff8f0;
            border-radius: 10px;
            border-left: 5px solid #d4a373;
        }
        .earn-list li span:first-child {
            font-size: 1.1em;
        }
        .earn-btn {
            background: #8b5a2b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
        }
        .earn-btn:hover {
            background: #6b4423;
        }
        .earn-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* --- УВЕДОМЛЕНИЕ --- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #6b4423;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            transition: transform 0.4s;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- АДАПТИВ ДЛЯ ТЕЛЕФОНА --- */
        @media (max-width: 768px) {
            header h1 { font-size: 2em; }
            .gallery { height: 500px; }
            .photo-1 { width: 180px; left: 2%; }
            .photo-2 { width: 190px; right: 2%; }
            .photo-3 { width: 170px; left: 15%; top: 280px; }
            .shop, .earn-section { margin: 20px 10px; padding: 20px; }
            .items-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- МУЗЫКА: файл music.mp3 должен лежать рядом с index.html -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <button class="music-btn" id="musicBtn" title="Включить/выключить музыку">🎵</button>

    <!-- ЗАГОЛОВОК -->
    <header>
        <h1>🍁 Октябрь для тебя 🍁</h1>
        <p>Самый тёплый месяц этой осени</p>
    </header>

    <!-- ФОТОГРАФИИ: файлы photo1.jpg, photo2.jpg, photo3.jpg должны лежать рядом с index.html -->
    <div class="gallery">
        <div class="photo photo-1">
            <img src="photo1.jpg" alt="Мы вместе">
            <div class="caption">Наше счастье ❤️</div>
        </div>
        <div class="photo photo-2">
            <img src="photo2.jpg" alt="Мы вместе">
            <div class="caption">Тёплые моменты</div>
        </div>
        <div class="photo photo-3">
            <img src="photo3.jpg" alt="Мы вместе">
            <div class="caption">Люблю тебя</div>
        </div>
    </div>

    <!-- МАГАЗИН ПОДАРКОВ -->
    <div class="shop">
        <h2>🎁 Выбери свой подарок</h2>
        <div class="balance-box">
            Твой баланс: <span id="balanceDisplay">10</span> баллов
        </div>
        <div class="items-grid" id="itemsGrid">
            <!-- Товары будут добавлены через JavaScript -->
        </div>
    </div>

    <!-- ЗАРАБОТОК БАЛЛОВ -->
    <div class="earn-section">
        <h2>💝 Как заработать баллы</h2>
        <ul class="earn-list" id="earnList">
            <!-- Действия будут добавлены через JavaScript -->
        </ul>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div class="toast" id="toast"></div>

    <script>
        // ================== ДАННЫЕ ==================
        // Начальный баланс
        let balance = 10;

        // Список подарков (название, цена)
        const gifts = [
            { name: "ТГ Премиум (месяц)", price: 4 },
            { name: "Дофаминовый букет", price: 7 },
            { name: "Плед", price: 7 },
            { name: "Мини-термос", price: 7 },
            { name: "Милая грелка", price: 3 },
            { name: "Тёплые носочки", price: 3 },
            { name: "Шедевр кулинарии от Артёма", price: 10 },
            { name: "Поездка за город", price: 8 },
            { name: "Чайный набор", price: 5 },
            { name: "Меховые тапочки (угги)", price: 5 }
        ];

        // Список действий для заработка (название, цена, лимит)
        // limit: null = неограниченно, число = сколько раз можно
        const earnActions = [
            { name: "Поцелуй", price: 1, limit: 3, used: 0 },
            { name: "Массаж 30 мин", price: 3, limit: null, used: 0 },
            { name: "Совместная ванна", price: 3, limit: 1, used: 0 },
            { name: "Желание", price: 100, limit: 1, used: 0 }
        ];

        // ================== ЛОГИКА ==================

        // Обновление баланса на экране
        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = balance;
            // Обновляем доступность кнопок покупки
            document.querySelectorAll('.buy-btn').forEach((btn, index) => {
                btn.disabled = gifts[index].price > balance;
            });
            // Обновляем доступность кнопок заработка
            document.querySelectorAll('.earn-btn').forEach((btn, index) => {
                const action = earnActions[index];
                if (action.limit !== null && action.used >= action.limit) {
                    btn.disabled = true;
                    btn.textContent = 'Использовано';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Получить';
                }
            });
        }

        // Показать уведомление
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Отрисовка товаров
        function renderGifts() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            gifts.forEach((gift, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <h3>${gift.name}</h3>
                    <div class="item-price">${gift.price} б.</div>
                    <button class="buy-btn" data-index="${index}">Купить</button>
                `;
                grid.appendChild(card);
            });

            // Обработчики покупки
            document.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.dataset.index;
                    const gift = gifts[index];
                    if (balance >= gift.price) {
                        balance -= gift.price;
                        updateBalance();
                        showToast(`🎉 Ты выбрала: ${gift.name}!`);
                    } else {
                        showToast('❌ Недостаточно баллов');
                    }
                });
            });
            updateBalance();
        }

        // Отрисовка действий для заработка
        function renderEarnActions() {
            const list = document.getElementById('earnList');
            list.innerHTML = '';
            earnActions.forEach((action, index) => {
                const li = document.createElement('li');
                let limitText = '';
                if (action.limit !== null) {
                    limitText = ` (осталось: ${action.limit - action.used})`;
                } else {
                    limitText = ' (без ограничений)';
                }
                li.innerHTML = `
                    <span>${action.name} — <b>${action.price} б.</b>${limitText}</span>
                    <button class="earn-btn" data-index="${index}">Получить</button>
                `;
                list.appendChild(li);
            });

            // Обработчики заработка
            document.querySelectorAll('.earn-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.target.dataset.index;
                    const action = earnActions[index];
                    if (action.limit !== null && action.used >= action.limit) {
                        showToast('Это действие уже использовано');
                        return;
                    }
                    balance += action.price;
                    action.used++;
                    updateBalance();
                    renderEarnActions(); // Перерисовываем, чтобы обновить счетчики
                    showToast(`+${action.price} баллов за "${action.name}"`);
                });
            });
            updateBalance();
        }

        // ================== МУЗЫКА ==================
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '🎵';
                musicBtn.title = 'Включить музыку';
            } else {
                music.play().catch(e => console.log('Ошибка воспроизведения:', e));
                musicBtn.textContent = '🔇';
                musicBtn.title = 'Выключить музыку';
            }
            isPlaying = !isPlaying;
        });

        // ================== ПАДАЮЩИЕ ЛИСТЬЯ ==================
        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            const leaves = ['🍁', '🍂', '🍃'];
            leaf.textContent = leaves[Math.floor(Math.random() * leaves.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = (Math.random() * 5 + 5) + 's';
            leaf.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(leaf);
            setTimeout(() => leaf.remove(), 10000);
        }
        setInterval(createLeaf, 800);

        // ================== ИНИЦИАЛИЗАЦИЯ ==================
        renderGifts();
        renderEarnActions();
    </script>
</body>
</html>
